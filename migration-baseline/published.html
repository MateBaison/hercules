function equipment(n){n=n.toLowerCase();if(n.includes('mancuerna'))return'Mancuernas';if(n.includes('barra t'))return'Barra T';if(n.includes('barra')||n.includes('militar'))return'Barra';if(n.includes('polea')||n.includes('cable'))return'Polea';if(n.includes('máquina')||n.includes('maquina')||n.includes('peck')||n.includes('prensa'))return'Máquina';if(n.includes('kettlebell'))return'Kettlebell';if(n.includes('banda'))return'Banda';if(n.includes('balón'))return'Balón medicinal';return'Peso corporal'}
function pattern(n){n=n.toLowerCase();if(/press|flexion|fondos/.test(n))return'push';if(/remo|jalón|elevaciones en barra/.test(n))return'pull';if(/curl/.test(n))return'curl';if(/extensión de tríceps|press francés|patadas traseras/.test(n))return'triceps';if(/sentadilla|prensa|zancada|step up/.test(n))return'squat';if(/peso muerto|buenos días|columpios/.test(n))return'hinge';if(/plancha|crunch|abdominal|elevación de piernas|rodillas/.test(n))return'core';if(/elevación lateral|elevación frontal|pájaro|cruces inversos/.test(n))return'raise';if(/gemelos/.test(n))return'calf';if(/puente|cadera|abdu|almejas|hidrantes|patadas de burro/.test(n))return'hip';return'move'}
const guides={push:['Estabilizá pies, tronco y omóplatos antes de mover la carga.','Bajá con control hasta un rango cómodo, sin perder la alineación.','Empujá siguiendo la trayectoria del implemento y evitá bloquear de golpe.'],pull:['Fijá el tronco y empezá con hombros lejos de las orejas.','Llevá los codos en la dirección indicada, sin balancear el cuerpo.','Regresá despacio hasta extender los brazos manteniendo tensión.'],curl:['Mantené los codos estables y las muñecas alineadas.','Flexioná el codo sin impulsar el torso.','Descendé por completo y con control.'],triceps:['Fijá hombros y codos antes de comenzar.','Extendé el codo sin desplazar la parte superior del brazo.','Volvé lentamente hasta una flexión cómoda.'],squat:['Afirmá todo el pie y alineá rodillas con los dedos.','Descendé flexionando cadera y rodillas con el tronco firme.','Empujá el suelo para volver sin perder la postura.'],hinge:['Desbloqueá las rodillas y llevá la cadera hacia atrás.','Mantené la carga cerca y la espalda estable.','Extendé la cadera para volver, sin hiperextender la zona lumbar.'],core:['Alineá costillas y pelvis; activá el abdomen antes de moverte.','Realizá el recorrido sin tirar del cuello ni arquear la espalda.','Volvé con control manteniendo la respiración fluida.'],raise:['Fijá el torso y mantené una leve flexión de codos.','Elevá los brazos en el plano indicado sin encoger los hombros.','Bajá lentamente sin usar impulso.'],calf:['Apoyá el antepié y mantené estable el resto del cuerpo.','Elevá los talones hasta una contracción clara.','Descendé despacio hasta un estiramiento cómodo, sin rebotar.'],hip:['Estabilizá pelvis y abdomen antes de iniciar.','Mové la cadera o la pierna sin compensar con la zona lumbar.','Volvé de forma lenta conservando la tensión.'],move:['Prepará una base estable y revisá el recorrido sin carga.','Ejecutá el movimiento de manera controlada.','Volvé a la posición inicial sin perder la alineación.']};

const RETIRED_EXERCISES=new Set(['curl-de-piernas-sentado','1-5-repeticiones-de-sentadillas-con-propio-peso','elevaciones-de-biceps-femoral-con-maquina-ghd','sentadilla-en-postura-funcional','curl-con-cuerda-en-polea','extension-de-muneca-con-barra-sentado']);
function retireExercisesFromPlans(){let changed=false;
  for(const routine of state.routines||[])for(const day of routine.days||[]){if(!Array.isArray(day.items))continue;const kept=day.items.filter(id=>!RETIRED_EXERCISES.has(id));if(kept.length!==day.items.length){day.items=kept;changed=true}}
  if(Array.isArray(state.workout?.entries)){const kept=state.workout.entries.filter(entry=>!RETIRED_EXERCISES.has(entry.id));if(kept.length!==state.workout.entries.length){state.workout.entries=kept;changed=true}}
  if(changed)try{save()}catch(error){console.warn('Could not persist retired exercise cleanup',error)}
  return changed;
}

function routineDialog(id){let r=state.routines.find(x=>x.id===id);sheet.classList.remove('hidden');sheet.innerHTML=`<div class="sheetbox"><div class="handle"></div><button class="iconbtn close">✕</button><h2>${r?'Renombrar rutina':'Nueva rutina'}</h2><div class="field"><label>Nombre</label><input id="rn" value="${r?.name||''}" placeholder="Ej. Fuerza 4 días"></div>${r?'':`<div class="field"><label>Objetivo</label><select id="rg"><option>Fuerza e hipertrofia</option><option>Ganar masa muscular</option><option>Mejorar condición física</option></select></div>`}<button class="primary" id="saveRoutine" style="width:100%">Guardar</button></div>`;sheet.querySelector('.close').onclick=closeSheet;sheet.querySelector('#saveRoutine').onclick=()=>{let name=sheet.querySelector('#rn').value.trim();if(!name)return toast('Escribí un nombre');if(r)r.name=name;else{let rid='r'+Date.now();state.routines.push({id:rid,name,goal:sheet.querySelector('#rg').value,days:[]});state.selected=rid}save();closeSheet();render();toast('Rutina guardada')}}
function addDay(rid){let name=prompt('Nombre del día de entrenamiento');if(!name)return;state.routines.find(r=>r.id===rid).days.push({id:'d'+Date.now(),name,items:[]});save();render();toast('Día agregado')}
function addExercise(id){if(!state.routines.length){closeSheet();routineDialog();return}let r=state.routines.find(x=>x.id===state.selected)||state.routines[0];if(!r.days.length){r.days.push({id:'d'+Date.now(),name:'Día 1',items:[]})}r.days[0].items.push(id);save();closeSheet();toast('Agregado a '+r.days[0].name)}

function removeExercise(rid,did,id){let d=state.routines.find(r=>r.id===rid).days.find(d=>d.id===did);d.items.splice(d.items.indexOf(id),1);save();render();toast('Ejercicio quitado')}
function startWorkout(rid,did){let r=state.routines.find(x=>x.id===rid),d=r?.days.find(x=>x.id===did);if(!d?.items.length)return toast('Agregá al menos un ejercicio a este día');state.workout={rid,did,started:Date.now(),index:0,entries:d.items.map(id=>({id,note:'',sets:Array.from({length:3},()=>defaultExerciseSet(id))}))};save();workoutView()}

let restInt;function restTimer(){let sec=60;toast('Descanso: 60 s');clearInterval(restInt);restInt=setInterval(()=>{sec--;if(sec===0){clearInterval(restInt);toast('Descanso terminado');if(navigator.vibrate)navigator.vibrate([150,80,150])}},1000)}
function finishWorkout(r,d){let w=state.workout;let volume=w.entries.reduce((a,x)=>a+x.sets.filter(s=>s.done).reduce((b,s)=>b+s.kg*s.reps,0),0);state.sessions.unshift({id:'s'+Date.now(),date:new Date().toISOString(),routine:r.name,day:d.name,duration:Math.round((Date.now()-w.started)/60000),volume});state.workout=null;save();state.tab='progress';render();toast('Entrenamiento guardado')}

function attachWorkoutStatusBanner(){

  const exercise=byId(w.entries?.[w.index]?.id),position=w.index+1;
  view.insertAdjacentHTML('afterbegin',`<button type="button" class="workout-ongoing-banner" id="activeWorkoutBanner" aria-label="${txt('Entrenamiento en curso','Workout in progress')}: ${safe(routine.name)}, ${safe(day.name)}. ${txt('Volver al entrenamiento','Return to workout')}"><span class="ongoing-mark" aria-hidden="true">●</span><span class="ongoing-copy"><small>${txt('Entrenamiento en curso','Workout in progress')}</small><strong>${safe(day.name)}</strong><small>${safe(routine.name)}${exercise?' · '+safe(exercise.name):''} · ${position}/${w.entries.length}</small></span><span class="ongoing-action">${txt('Volver','Resume')} <b aria-hidden="true">↗</b></span></button>`);

const calendarState={month:new Date(new Date().getFullYear(),new Date().getMonth(),1)};

function calendarMarkup(){
  const y=calendarState.month.getFullYear(),m=calendarState.month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();
  const counts={};state.sessions.forEach(s=>{const key=localDateKey(s.date);if(key)counts[key]=(counts[key]||0)+1});
  const today=localDateKey(new Date()),monthName=`${new Intl.DateTimeFormat(state.settings.language,{month:'long'}).format(calendarState.month)} ${y}`;
  const weekdays=Array.from({length:7},(_,i)=>new Intl.DateTimeFormat(state.settings.language,{weekday:'short'}).format(new Date(2024,0,1+i)));
  const cells=Array.from({length:Math.ceil((first+last)/7)*7},(_,i)=>{const day=i-first+1;if(day<1||day>last)return'<span class="calendar-blank"></span>';const key=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,count=counts[key]||0;return`<button class="calendar-day ${count?'trained':''} ${key===today?'today':''}" data-calendar-date="${key}" aria-label="${day} ${monthName}, ${count} ${txt('entrenamientos','workouts')}">${day}</button>`});

}
function calendarDayDetails(key){

t('Serie','Set')}</button></div>`).join('')}<div class="field"><label for="manualExercise">${txt('Agregar ejercicio','Add exercise')}</label><select id="manualExercise"><option value="">${txt('Elegí un ejercicio','Choose an exercise')}</option>${Object.keys(GROUPS).map(g=>`<optgroup label="${g}">${EX.filter(e=>e.group===g).map(e=>`<option value="${e.id}">${safe(e.name)}</option>`).join('')}</optgroup>`).join('')}</select></div><button class="primary" id="saveManual" style="width:100%">${txt('Guardar entrenamiento','Save workout')}</button>`:`<p class="muted">${txt('Primero creá una rutina con un día.','First create a routine with a day.')}</p>`}</div>`;

    photoPreview();sheet.querySelector('#manualComment').oninput=e=>manualComment=e.target.value;
    sheet.querySelector('#manualPhotos').onchange=async e=>{const files=[...e.target.files];if(manualPhotos.length+files.length>3)return toast(txt('Podés guardar hasta 3 fotos por entrenamiento.','You can save up to 3 photos per workout.'));photoProcessing=true;sheet.querySelector('#saveManual').disabled=true;try{manualPhotos.push(...await Promise.all(files.map(compressWorkoutPhoto)));photoPreview()}catch(error){toast(txt('No se pudo procesar una foto. Elegí imágenes menores a 8 MB.','Could not process a photo. Choose images under 8 MB.'))}finally{photoProcessing=false;sheet.querySelector('#saveManual').disabled=false;e.target.value=''}};

function wireRoutineReorder(){
  view.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    const card=handle.closest('.routine-exercise'),list=card.parentElement,[rid,did,index]=handle.dataset.dragHandle.split('|');
    handle.onpointerdown=e=>{
      if(e.button!==0&&e.pointerType==='mouse')return;
      e.preventDefault();
      const pointerId=e.pointerId,startX=e.clientX,startY=e.clientY;let active=false;
      const activate=()=>{if(active)return;active=true;card.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(20)};
      let timer=setTimeout(activate,250);
      const stopTimer=()=>{if(timer){clearTimeout(timer);timer=null}};
      const cleanup=()=>{stopTimer();card.classList.remove('dragging');document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',finish);document.removeEventListener('pointercancel',cancel)};
      const move=event=>{
        if(event.pointerId!==pointerId)return;

        event.preventDefault();card.style.pointerEvents='none';const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('.routine-exercise');card.style.pointerEvents='';

      };

        day.items=order;openRoutineDays.add(`${rid}|${did}`);save();homeView();toast(txt('Orden guardado','Order saved'));
      };
      const cancel=event=>{if(event.pointerId!==pointerId)return;const wasActive=active;cleanup();if(wasActive)homeView()};
      document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',finish);document.addEventListener('pointercancel',cancel);
    };

const AUTO_ROUTINE_EXERCISES={
  'Pectorales':['press-de-banca-con-barra','press-banca-inclinado-con-mancuernas','aperturas-en-maquina-peck-deck-o-contractora','press-de-banca-con-mancuernas','cruce-de-poleas','flexiones'],

  'Bíceps':['curl-con-barra-ez','curl-alterno-de-martillo-con-mancuernas','curl-inclinado-con-mancuernas','curl-alterno-con-mancuernas'],
  'Tríceps':['extension-de-triceps-en-polea','extension-de-triceps-con-polea-trasnuca','extension-de-triceps-con-mancuernas-por-encima-de-la-cabeza','extension-de-triceps-en-polea-con-cuerda'],

  'Gemelos':['elevacion-de-gemelos-de-pie','elevacion-de-gemelos-sentado']

function buildAutomaticRoutine(groups,dayCount){
  const selected=Object.keys(GROUPS).filter(g=>groups.includes(g));
  if(!selected.length||!Number.isInteger(dayCount)||dayCount<1||dayCount>7)throw new Error('Elegí al menos un músculo y entre 1 y 7 días.');
  let splits;
  if(dayCount===1)splits=[selected];
  else if(dayCount===2){
    const lower=selected.filter(g=>['Piernas','Gemelos','Abdominales'].includes(g)),upper=selected.filter(g=>!lower.includes(g));
    splits=upper.length&&lower.length?[upper,lower]:[selected.filter((_,i)=>i%2===0),selected.filter((_,i)=>i%2===1)].filter(s=>s.length);
  }else{
    splits=[['Pectorales','Hombros','Tríceps'],['Espalda','Bíceps'],['Piernas','Gemelos']].map(f=>f.filter(g=>selected.includes(g))).filter(s=>s.length);
    if(selected.includes('Abdominales')){if(!splits.length)splits=[['Abdominales']];else splits.reduce((a,b)=>a.length<=b.length?a:b).push('Abdominales')}
    while(splits.length<Math.min(3,dayCount,selected.length)){
      const largest=splits.reduce((a,b)=>a.length>=b.length?a:b);if(largest.length<2)break;splits.push(largest.splice(Math.ceil(largest.length/2)));
    }
  }
  const pools=Object.fromEntries(selected.map(group=>[group,(AUTO_ROUTINE_EXERCISES[group]||[]).filter(id=>byId(id)?.group===group)]));
  if(selected.some(g=>!pools[g].length))throw new Error('No se encontraron ejercicios para una de las zonas.');
  const uses=Object.fromEntries(selected.map(g=>[g,0])),rid='r'+cryptoRoutineId();
  const days=Array.from({length:dayCount},(_,index)=>{
    const muscles=splits[index%splits.length],allocation=Object.fromEntries(muscles.map(g=>[g,1]));
    const target=muscles.length===1?4:muscles.length===2?5:6;
    const limit=Math.max(muscles.length,Math.min(target,muscles.reduce((sum,g)=>sum+pools[g].length,0)));
    let total=muscles.length;
    while(total<limit){const available=muscles.filter(g=>allocation[g]<pools[g].length);if(!available.length)break;const group=available.reduce((a,b)=>allocation[a]<=allocation[b]?a:b);allocation[group]++;total++}
    const items=muscles.flatMap(group=>{const pool=pools[group],offset=uses[group]++%pool.length;return Array.from({length:allocation[group]},(_,i)=>pool[(offset+i)%pool.length])});
    return{id:rid+'-d'+(index+1),name:`${txt('Día','Day')} ${index+1} · ${muscles.join(' + ')}`,items};
  });
  return{id:rid,name:`${txt('Rutina automática','Automatic routine')} · ${dayCount} ${txt('días','days')}`,goal:txt('Fuerza e hipertrofia','Strength and hypertrophy'),days};
}

const clockRuntime={section:'stopwatch',sw:{running:false,started:0,elapsed:0},timer:{running:false,end:0,remaining:30},combat:{mode:'boxeo',rounds:12,work:180,rest:60,prep:10,round:1,phase:'prep',remaining:10,running:false,end:0},track:{mode:'run',running:false,preparing:false,prep:10,prepRemaining:10,prepEnd:0,started:0,elapsed:0,distance:0,points:[],watchId:null,error:'',speed:0}};

function compressWorkoutPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')||file.size>8*1024*1024)return reject(new Error('invalid image'));
    const reader=new FileReader();reader.onerror=reject;
    reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{
      const scale=Math.min(1,640/Math.max(image.width,image.height)),canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',.65));
    };image.src=reader.result};reader.readAsDataURL(file);
  });
}
function bodyWeightDisplay(value,unit=state.settings.weight){return Number.isFinite(value)&&value>0?String(Math.round(value*(unit==='lb'?2.20462:1)*100)/100):''}
function bodyWeightFields(prefix,start='',end='',unit=state.settings.weight){return`<section class="body-weight-fields"><h3>${txt('Peso corporal','Body weight')} · ${txt('opcional','optional')}</h3><div class="form-grid"><div class="field"><label for="${prefix}WeightStart">${txt('Peso inicial','Starting weight')} (${unit})</label><input id="${prefix}WeightStart" type="number" min="0.01" step="any" inputmode="decimal" placeholder="—" value="${safe(start)}"></div><div class="field"><label for="${prefix}WeightEnd">${txt('Peso final','Ending weight')} (${unit})</label><input id="${prefix}WeightEnd" type="number" min="0.01" step="any" inputmode="decimal" placeholder="—" value="${safe(end)}"></div></div></section>`}
function parseBodyWeights(start,end,unit=state.settings.weight){
  const values=[start,end].map(raw=>String(raw??'').trim());
  if(values.some(raw=>raw!==''&&(!Number.isFinite(Number(raw.replace(',','.')))||Number(raw.replace(',','.'))<=0))){toast(txt('Ingresá un peso mayor a cero o dejá el campo vacío.','Enter a weight greater than zero or leave the field blank.'));return null}
  const [bodyWeightStartKg,bodyWeightEndKg]=values.map(raw=>raw===''?null:Number(raw.replace(',','.'))/(unit==='lb'?2.20462:1));
  return{bodyWeightStartKg,bodyWeightEndKg};
}

<script>
function detail(id){
  const e=byId(id); if(!e)return;
  const ids=state.tab==='library'&&state.filter==='Favoritos'?EX.filter(item=>isFavorite(item.id)).map(item=>item.id):(GROUPS[e.group]||[]).map(slug);
  const pos=ids.indexOf(id);
  const prev=pos>0?byId(ids[pos-1]):null;
  const next=pos>=0&&pos<ids.length-1?byId(ids[pos+1]):null;
  sheet.classList.remove('hidden');
  sheet.innerHTML=`<div class="sheetbox"><div class="handle"></div><button class="iconbtn close" aria-label="${txt('Cerrar','Close')}">✕</button><div class="eyebrow">${e.group} · ${e.equipment}</div><h2>${e.name}</h2>${visual(e,true)}<div class="exercise-nav"><button class="ghost" id="prevEx" ${prev?'':'disabled'} aria-label="${txt('Ejercicio anterior','Previous exercise')}">← ${txt('Anterior','Previous')}</button><button type="button" class="favorite-toggle detail-favorite ${isFavorite(id)?'is-favorite':''}" id="favoriteExercise" aria-label="${isFavorite(id)?txt('Quitar de favoritos','Remove from favorites'):txt('Agregar a favoritos','Add to favorites')}: ${safe(e.name)}" aria-pressed="${isFavorite(id)}">★</button><button class="ghost" id="nextEx" ${next?'':'disabled'} aria-label="${txt('Ejercicio siguiente','Next exercise')}">${txt('Siguiente','Next')} →</button></div><h3>${txt('Técnica','Technique')}</h3><ol class="steps">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="row"><button class="primary" id="addEx">${txt('Agregar a rutina','Add to routine')}</button><button class="ghost close2">${txt('Cerrar','Close')}</button></div></div>`;
  sheet.querySelector('.close').onclick=sheet.querySelector('.close2').onclick=closeSheet;
  sheet.onclick=ev=>{if(ev.target===sheet)closeSheet()};
  sheet.querySelector('#addEx').onclick=()=>addExercise(id);
  sheet.querySelector('#favoriteExercise').onclick=()=>{toggleFavorite(id);if(state.tab==='library'){const query=view.querySelector('#q')?.value||'';libraryView();const field=view.querySelector('#q');if(field){field.value=query;field.oninput?.()}}detail(id)};
  if(prev)sheet.querySelector('#prevEx').onclick=()=>detail(prev.id);
  if(next)sheet.querySelector('#nextEx').onclick=()=>detail(next.id);
}
document.addEventListener('keydown',function(event){
  if(sheet.classList.contains('hidden'))return;
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
    const title=sheet.querySelector('h2'); if(!title)return;
    const current=EX.find(x=>x.name===title.textContent); if(!current)return;
    const ids=state.tab==='library'&&state.filter==='Favoritos'?EX.filter(item=>isFavorite(item.id)).map(item=>item.id):(GROUPS[current.group]||[]).map(slug),i=ids.indexOf(current.id);
    const target=event.key==='ArrowLeft'?ids[i-1]:ids[i+1];
    if(target){event.preventDefault();detail(target)}
  }
});
</script>
<script>
/* Training tools and per-exercise progress. Calculations stay on this device. */
for(const [language,labels] of Object.entries({fr:['Outils','Calculateurs','Calories','Macros','Maximum sur une répétition','Progression par exercice'],zh:['工具','计算器','热量','宏量营养素','单次最大重量','按动作查看进展'],hi:['उपकरण','कैलकुलेटर','कैलोरी','मैक्रो','एक रेप अधिकतम','व्यायाम के अनुसार प्रगति'],ar:['الأدوات','الآلات الحاسبة','السعرات','العناصر الغذائية','الحد الأقصى لتكرار واحد','التقدم حسب التمرين'],de:['Werkzeuge','Rechner','Kalorien','Makros','Ein-Wiederholungs-Maximum','Fortschritt pro Übung'],it:['Strumenti','Calcolatori','Calorie','Macro','Massimale per una ripetizione','Progressi per esercizio'],pt:['Ferramentas','Calculadoras','Calorias','Macros','Máximo de uma repetição','Evolução por exercício']}))Object.assign(UI_TRANSLATIONS[language],{'Herramientas':labels[0],'Calculadoras':labels[1],'Calorías':labels[2],'Macros':labels[3],'1 repetición máxima':labels[4],'Evolución por ejercicio':labels[5]});
for(const [language,label] of Object.entries({fr:'Objectif de poids',zh:'体重目标',hi:'वज़न लक्ष्य',ar:'هدف الوزن',de:'Gewichtsziel',it:'Obiettivo di peso',pt:'Meta de peso'}))Object.assign(UI_TRANSLATIONS[language],{'Meta de peso':label});
let toolsArea='clock',calculatorTab='calories',selectedProgressExercise='';
const originalToolsNav=navRender;
navRender=function(){originalToolsNav();const button=nav.querySelector('[data-tab="clock"]');if(button)button.innerHTML=`<b>◷</b>${txt('Herramientas','Tools')}`};
const originalToolsClock=clockView;
clockView=function(){if(toolsArea==='calculators')calculatorView();else{originalToolsClock();insertToolsSwitch()}};
function insertToolsSwitch(){
  const toolbar=view.querySelector('.toolbar');if(!toolbar)return;
  toolbar.insertAdjacentHTML('afterend',`<div class="tools-switch" role="group" aria-label="${txt('Herramientas','Tools')}"><button class="ghost ${toolsArea==='clock'?'active':''}" data-tools-area="clock" aria-pressed="${toolsArea==='clock'}">◷ ${txt('Reloj','Clock')}</button><button class="ghost ${toolsArea==='calculators'?'active':''}" data-tools-area="calculators" aria-pressed="${toolsArea==='calculators'}">▦ ${txt('Calculadoras','Calculators')}</button></div>`);
  view.querySelectorAll('[data-tools-area]').forEach(button=>button.onclick=()=>{toolsArea=button.dataset.toolsArea;clockView()});
}
const birth=state.profile.birth?new Date(state.profile.birth+'T12:00:00'):null;
const currentAge=birth&&!Number.isNaN(birth.getTime())?Math.floor((Date.now()-birth.getTime())/31557600000):30;
const profileHeight=Number(state.profile.height)||0;
const calcCaloriesState={formula:state.profile.gender==='hombre'?'male':state.profile.gender==='mujer'?'female':'',age:Math.max(18,Math.min(100,currentAge)),heightCm:state.settings.height==='ft'?(profileHeight>20?profileHeight*2.54:profileHeight>0?profileHeight*30.48:175):profileHeight||175,weightKg:state.settings.weight==='lb'?(Number(state.profile.weight)||165)/2.20462:Number(state.profile.weight)||75,activity:'1.55',result:null};
const calcGoalState={targetKg:null,result:null};
const calcMacrosState={calories:2000,split:'balanced',meals:3,result:null};
const calcOneRepState={weight:0,reps:5,unit:state.settings.weight,result:null};
const macroSplits={balanced:[40,30,30],protein:[30,40,30],lowerCarb:[20,40,40],keto:[5,25,70]};
const calculatorLabels={calories:['Calorías','Calories'],macros:['Macros','Macros'],weightgoal:['Meta de peso','Weight goal'],onerep:['1 repetición máxima','One rep max']};
function calculatorView(){
  state.tab='clock';navRender();
  view.innerHTML=`<div class="toolbar"><div><h1>${txt('Calculadoras','Calculators')}</h1><p>${txt('Estimaciones para planificar tu entrenamiento.','Estimates for planning your training.')}</p></div></div><div class="calc-tabs" role="tablist" aria-label="${txt('Calculadoras','Calculators')}">${Object.entries(calculatorLabels).map(([id,label])=>`<button class="chip ${calculatorTab===id?'active':''}" role="tab" aria-selected="${calculatorTab===id}" data-calculator="${id}">${txt(...label)}</button>`).join('')}</div><div id="calculatorContent"></div>`;
  insertToolsSwitch();
  view.querySelectorAll('[data-calculator]').forEach(button=>button.onclick=()=>{calculatorTab=button.dataset.calculator;calculatorView()});
  paintCalculator();
}
function paintCalculator(){
  const box=view.querySelector('#calculatorContent');if(!box)return;
  if(calculatorTab==='calories')paintCalories(box);
  else if(calculatorTab==='macros')paintMacros(box);
  else if(calculatorTab==='weightgoal')paintWeightGoal(box);
  else paintOneRep(box);
}
function calorieFields(c,prefix){
  const imperialHeight=state.settings.height==='ft',weightUnit=state.settings.weight;
  const inches=Math.round(c.heightCm/2.54*10)/10,feet=Math.floor(inches/12),remainingInches=Math.round((inches-feet*12)*10)/10;
  const displayWeight=Math.round((weightUnit==='lb'?c.weightKg*2.20462:c.weightKg)*10)/10;
  return `<div class="field"><label for="${prefix}Formula">${txt('Sexo','Sex')}</label><select id="${prefix}Formula" required><option value="">${txt('Elegí una opción','Choose an option')}</option><option value="male" ${c.formula==='male'?'selected':''}>${txt('Masculino','Male')}</option><option value="female" ${c.formula==='female'?'selected':''}>${txt('Femenino','Female')}</option></select></div><div class="field"><label for="${prefix}Age">${txt('Edad','Age')}</label><input id="${prefix}Age" type="number" inputmode="numeric" min="18" max="100" required value="${c.age}"></div>${imperialHeight?`<div class="field"><label for="${prefix}Feet">${txt('Altura (pies)','Height (feet)')}</label><input id="${prefix}Feet" type="number" inputmode="numeric" min="3" max="8" required value="${feet}"></div><div class="field"><label for="${prefix}Inches">${txt('Pulgadas','Inches')}</label><input id="${prefix}Inches" type="number" inputmode="decimal" min="0" max="11.9" step="0.1" required value="${remainingInches}"></div>`:`<div class="field"><label for="${prefix}Height">${txt('Altura','Height')} (cm)</label><input id="${prefix}Height" type="number" inputmode="decimal" min="100" max="250" step="0.1" required value="${Math.round(c.heightCm*10)/10}"></div>`}<div class="field"><label for="${prefix}Weight">${txt('Peso actual','Current weight')} (${weightUnit})</label><input id="${prefix}Weight" type="number" inputmode="decimal" min="${weightUnit==='lb'?55:25}" max="${weightUnit==='lb'?880:400}" step="0.1" required value="${displayWeight}"></div><div class="field wide"><label for="${prefix}Activity">${txt('Actividad habitual','Usual activity')}</label><select id="${prefix}Activity"><option value="1.2" ${c.activity==='1.2'?'selected':''}>${txt('Sedentaria','Sedentary')}</option><option value="1.375" ${c.activity==='1.375'?'selected':''}>${txt('Ligera · 1–3 días/semana','Light · 1–3 days/week')}</option><option value="1.55" ${c.activity==='1.55'?'selected':''}>${txt('Moderada · 3–5 días/semana','Moderate · 3–5 days/week')}</option><option value="1.725" ${c.activity==='1.725'?'selected':''}>${txt('Alta · 6–7 días/semana','High · 6–7 days/week')}</option><option value="1.9" ${c.activity==='1.9'?'selected':''}>${txt('Muy alta · actividad intensa diaria','Very high · intense daily activity')}</option></select></div>`;
}
function captureCalorieFields(form,c,prefix){
  c.formula=form.querySelector('#'+prefix+'Formula').value;
  c.age=Number(form.querySelector('#'+prefix+'Age').value);
  c.heightCm=state.settings.height==='ft'?(Number(form.querySelector('#'+prefix+'Feet').value)*12+Number(form.querySelector('#'+prefix+'Inches').value))*2.54:Number(form.querySelector('#'+prefix+'Height').value);
  c.weightKg=Number(form.querySelector('#'+prefix+'Weight').value)/(state.settings.weight==='lb'?2.20462:1);
  c.activity=form.querySelector('#'+prefix+'Activity').value;
}
function calorieMetrics(c,weightKg=c.weightKg){
  if(!['male','female'].includes(c.formula)||!Number.isInteger(c.age)||c.age<18||c.age>100||!Number.isFinite(c.heightCm)||c.heightCm<100||c.heightCm>250||!Number.isFinite(weightKg)||weightKg<25||weightKg>400||![1.2,1.375,1.55,1.725,1.9].includes(Number(c.activity)))return null;
  const bmr=10*weightKg+6.25*c.heightCm-5*c.age+(c.formula==='male'?5:-161);
  return {bmr:Math.round(bmr),maintenance:Math.round(bmr*Number(c.activity))};
}
function paintCalories(box){
  const c=calcCaloriesState;
  box.innerHTML=`<section class="panel calc-panel"><h2>${txt('Calculadora de calorías','Calorie calculator')}</h2><p class="muted">${txt('Estimá tus necesidades diarias según tus datos y actividad.','Estimate daily needs from your details and activity.')}</p><form id="calorieForm"><div class="calc-form">${calorieFields(c,'cal')}</div><button class="primary" type="submit" style="width:100%;margin-top:10px">${txt('Calcular calorías','Calculate calories')}</button></form><div id="calorieResult"></div><p class="calc-note">Mifflin–St Jeor · ${txt('Estimación para adultos. “Sexo” selecciona el coeficiente de esta fórmula; las necesidades reales varían. No sustituye una evaluación profesional.','Adult estimate. “Sex” selects this formula’s coefficient; actual needs vary. This does not replace professional assessment.')}</p></section>`;
  const form=box.querySelector('#calorieForm');
  form.oninput=()=>{captureCalorieFields(form,c,'cal');c.result=null;paintCalorieResult(box)};
  form.onsubmit=event=>{event.preventDefault();captureCalorieFields(form,c,'cal');const metrics=calorieMetrics(c);if(!metrics){toast(txt('Revisá los datos ingresados.','Check the entered values.'));return}c.result=metrics;paintCalorieResult(box)};
  paintCalorieResult(box);
}
function paintCalorieResult(box){
  const target=box.querySelector('#calorieResult'),r=calcCaloriesState.result;if(!target)return;
  if(!r){target.innerHTML='';return}
  const needs=[['loss',txt('Bajar de peso','Lose weight'),r.maintenance-300,txt('Punto de partida: unas 300 kcal menos que mantenimiento.','Starting point: about 300 kcal below maintenance.')],['maintain',txt('Mantener el peso','Maintain weight'),r.maintenance,txt('Para sostener el peso actual, aproximadamente.','Approximate intake to hold your current weight.')],['gain',txt('Subir de peso','Gain weight'),r.maintenance+300,txt('Punto de partida: unas 300 kcal más que mantenimiento.','Starting point: about 300 kcal above maintenance.')]];
  target.innerHTML=`<div class="calorie-options">${needs.map(([kind,label,kcal,description])=>`<article class="calorie-option ${kind}"><h3>${label}</h3><strong>${kcal>=1200?`${Math.round(kcal).toLocaleString(state.settings.language)} kcal`:`${txt('Consultar','Ask a professional')}`}</strong><p>${kcal>=1200?description:txt('La cifra sería demasiado baja para esta herramienta.','The figure would be too low for this tool.')}</p>${kcal>=1200?`<button class="ghost" data-macro-calories="${Math.round(kcal)}">${txt('Usar en macros','Use for macros')} →</button>`:''}</article>`).join('')}</div><p class="calc-review">${txt('Revisá tu evolución y ajustá estas cifras cada 2–3 semanas.','Check your progress and adjust these figures every 2–3 weeks.')}</p>`;
  target.querySelectorAll('[data-macro-calories]').forEach(button=>button.onclick=()=>{calcMacrosState.calories=Number(button.dataset.macroCalories);calcMacrosState.result=null;calculatorTab='macros';calculatorView()});
}
function paintMacros(box){
  const m=calcMacrosState;
  box.innerHTML=`<section class="panel calc-panel"><h2>${txt('Calculadora de macros','Macro calculator')}</h2><p class="muted">${txt('Repartí un objetivo calórico entre carbohidratos, proteínas y grasas.','Divide a calorie target into carbohydrates, protein and fat.')}</p><form id="macroForm"><div class="calc-form"><div class="field"><label for="macroCalories">${txt('Calorías diarias','Daily calories')}</label><input id="macroCalories" type="number" inputmode="numeric" min="1000" max="6000" required value="${m.calories}"></div><div class="field"><label for="macroMeals">${txt('Comidas por día','Meals per day')}</label><input id="macroMeals" type="number" inputmode="numeric" min="1" max="8" required value="${m.meals}"></div><div class="field wide"><label for="macroSplit">${txt('Distribución','Split')}</label><select id="macroSplit"><option value="balanced" ${m.split==='balanced'?'selected':''}>${txt('Equilibrada · 40/30/30','Balanced · 40/30/30')}</option><option value="protein" ${m.split==='protein'?'selected':''}>${txt('Más proteína · 30/40/30','Higher protein · 30/40/30')}</option><option value="lowerCarb" ${m.split==='lowerCarb'?'selected':''}>${txt('Menos carbohidratos · 20/40/40','Lower carb · 20/40/40')}</option><option value="keto" ${m.split==='keto'?'selected':''}>${txt('Muy baja en carbohidratos · 5/25/70','Very low carb · 5/25/70')}</option></select></div></div><button class="primary" type="submit" style="width:100%;margin-top:10px">${txt('Calcular macros','Calculate macros')}</button></form><div id="macroResult"></div><p class="calc-note">${txt('Las proporciones son opciones generales, no una dieta personalizada. Carbohidratos y proteínas: 4 kcal/g; grasas: 9 kcal/g.','These splits are general options, not a personalized diet. Carbohydrate and protein: 4 kcal/g; fat: 9 kcal/g.')}</p></section>`;
  const form=box.querySelector('#macroForm');form.oninput=()=>{m.calories=Number(form.querySelector('#macroCalories').value);m.meals=Number(form.querySelector('#macroMeals').value);m.split=form.querySelector('#macroSplit').value;m.result=null;paintMacroResult(box)};
  form.onsubmit=event=>{event.preventDefault();form.oninput();if(!Number.isFinite(m.calories)||m.calories<1000||m.calories>6000||!Number.isInteger(m.meals)||m.meals<1||m.meals>8)return toast(txt('Revisá los datos ingresados.','Check the entered values.'));const [carbs,protein,fat]=macroSplits[m.split];m.result={carbs:Math.round(m.calories*carbs/100/4),protein:Math.round(m.calories*protein/100/4),fat:Math.round(m.calories*fat/100/9),carbsPct:carbs,proteinPct:protein,fatPct:fat};paintMacroResult(box)};
  paintMacroResult(box);
}
function paintMacroResult(box){
  const target=box.querySelector('#macroResult'),m=calcMacrosState,r=m.result;if(!target)return;
  target.innerHTML=r?`<div class="calc-result"><small>${txt('Objetivo diario','Daily target')}</small><strong>${Math.round(m.calories).toLocaleString(state.settings.language)} kcal</strong><div class="macro-tiles"><div class="macro-tile carb"><b>${r.carbs} g</b><span>${txt('Carbohidratos','Carbohydrates')} · ${r.carbsPct}%</span></div><div class="macro-tile protein"><b>${r.protein} g</b><span>${txt('Proteínas','Protein')} · ${r.proteinPct}%</span></div><div class="macro-tile fat"><b>${r.fat} g</b><span>${txt('Grasas','Fat')} · ${r.fatPct}%</span></div></div></div><div class="meal-result"><h3>${txt('Por comida','Per meal')}</h3><p>${txt('Reparto aproximado en','Approximate split across')} ${m.meals} ${txt('comidas','meals')} · ${Math.round(m.calories/m.meals)} kcal ${txt('cada una','each')}</p><div class="macro-tiles"><div class="macro-tile carb"><b>${Math.round(r.carbs/m.meals)} g</b><span>${txt('Carbohidratos','Carbohydrates')}</span></div><div class="macro-tile protein"><b>${Math.round(r.protein/m.meals)} g</b><span>${txt('Proteínas','Protein')}</span></div><div class="macro-tile fat"><b>${Math.round(r.fat/m.meals)} g</b><span>${txt('Grasas','Fat')}</span></div></div></div>`:'';
}
function paintWeightGoal(box){
  const c=calcCaloriesState,g=calcGoalState,unit=state.settings.weight;
  const targetDisplay=g.targetKg===null?'':Math.round(g.targetKg*(unit==='lb'?2.20462:1)*10)/10;
  box.innerHTML=`<section class="panel calc-panel"><h2>${txt('Estimación de meta de peso','Weight goal estimate')}</h2><p class="muted">${txt('Ingresá tus datos y el peso al que te gustaría llegar.','Enter your details and desired weight.')}</p><form id="goalForm"><div class="calc-form">${calorieFields(c,'goal')}<div class="field wide"><label for="goalTarget">${txt('Peso deseado','Target weight')} (${unit})</label><input id="goalTarget" type="number" inputmode="decimal" min="${unit==='lb'?55:25}" max="${unit==='lb'?880:400}" step="0.1" required value="${targetDisplay}"></div></div><button class="primary" type="submit" style="width:100%;margin-top:10px">${txt('Estimar plazo','Estimate timeline')}</button></form><div id="goalResult"></div><p class="goal-sources">${txt('Solo para adultos. Es una orientación general, no una predicción ni un plan médico. El metabolismo, la actividad y la composición corporal cambian con el tiempo. No usar durante embarazo o lactancia.','Adults only. General guidance, not a prediction or medical plan. Metabolism, activity and body composition change over time. Not for pregnancy or breastfeeding.')} <a href="https://www.niddk.nih.gov/research-funding/at-niddk/labs-branches/laboratory-biological-modeling/integrative-physiology-section/research/body-weight-planner" target="_blank" rel="noopener noreferrer">NIDDK</a> · <a href="https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html" target="_blank" rel="noopener noreferrer">CDC</a></p></section>`;
